<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>SERVEUR DES SDF</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #050805;
    overflow: hidden;
    font-family: "Cascadia Code", "Consolas", "Lucida Console", "Courier New", monospace;
  }

  #scene {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  /* Voile de scanlines + vignette, esthétique tube cathodique */
  #crt {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    background-image: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.0) 0px,
      rgba(0,0,0,0.18) 1px,
      rgba(0,0,0,0.0) 3px
    );
    box-shadow: inset 0 0 140px rgba(0,0,0,0.85);
  }

  #panel {
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 560px;
    max-width: 88vw;
    padding: 22px 26px 18px 26px;
    background: rgba(6, 12, 8, 0.72);
    border: 1px solid rgba(60, 255, 139, 0.35);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4), 0 0 40px rgba(60,255,139,0.06);
    color: #d8ecdf;
  }

  #panel .bar {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    letter-spacing: 1px;
    color: #5f7a68;
    border-bottom: 1px solid rgba(60,255,139,0.2);
    padding-bottom: 8px;
    margin-bottom: 14px;
  }

  h1 {
    margin: 0 0 4px 0;
    font-size: 30px;
    letter-spacing: 3px;
    color: #baffd6;
    text-shadow: 0 0 10px rgba(60,255,139,0.55), 0 0 2px rgba(60,255,139,0.9);
  }

  h1 .dim { color: #3f5a4a; }

  .subtitle {
    margin: 0 0 16px 0;
    font-size: 13px;
    color: #7ec9a0;
    letter-spacing: 1px;
  }

  #log {
    font-size: 12.5px;
    line-height: 1.65;
    color: #9db7a9;
    min-height: 128px;
    white-space: pre-wrap;
  }

  #log .ok { color: #5cffa0; }
  #log .amber { color: #ffb238; }
  #log .path { color: #6faed6; }

  #cursor {
    display: inline-block;
    width: 7px;
    height: 13px;
    background: #5cffa0;
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .modes {
    margin: 14px 0 0 0;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .modes span {
    font-size: 11px;
    padding: 3px 8px;
    border: 1px solid rgba(60,255,139,0.35);
    color: #a8f5c8;
    letter-spacing: 0.5px;
  }

  #connect {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid rgba(60,255,139,0.2);
    font-size: 12.5px;
    color: #6faed6;
  }

  #connect .cmd { color: #e7f3ea; }

  footer {
    margin-top: 10px;
    font-size: 10.5px;
    color: #4b6656;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="crt"></div>

<div id="panel">
  <div class="bar">
    <span>SDF-NET // MOTD</span>
    <span id="clockline">--:--:--</span>
  </div>

  <h1>SERVEUR <span class="dim">//</span> DES SDF</h1>
  <div class="subtitle">Counter-Strike: Source — communautaire, multimode, sans domicile fixe</div>

  <div id="log"></div>

  <div class="modes">
    <span>COPS & RUNNERS</span>
    <span>HEADSHOT ONLY</span>
    <span>BHOP</span>
    <span>DEATHRUN</span>
    <span>GUNGAME</span>
  </div>

  <div id="connect">
    &gt; <span class="cmd">connect 89.3.201.42:8090</span>
  </div>

  <footer>Put your foolish ambition to rest</footer>
</div>

<script>
(function () {
  "use strict";

  // ---------------------------------------------------------------
  // Petit moteur de rendu filaire, dans l'esprit du moteur maison :
  // rotation par matrices, projection en perspective, tri peintre.
  // Volontairement minimal (pas de textures/clipping) pour rester
  // léger et compatible avec le navigateur embarqué du MOTD.
  // ---------------------------------------------------------------

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var W = 0, H = 0, CX = 0, CY = 0;

  function resize() {
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W;
    canvas.height = H;
    CX = W / 2;
    CY = H / 2;
  }
  window.addEventListener("resize", resize);
  resize();

  // Vecteur simple
  function V(x, y, z) { return { x: x, y: y, z: z }; }

  function rotateY(v, a) {
    var c = Math.cos(a), s = Math.sin(a);
    return V(v.x * c + v.z * s, v.y, -v.x * s + v.z * c);
  }

  function rotateX(v, a) {
    var c = Math.cos(a), s = Math.sin(a);
    return V(v.x, v.y * c - v.z * s, v.y * s + v.z * c);
  }

  // Cube "caisse" en fil de fer, avec une croix interne (façon caisse en carton)
  var cubeVerts = [
    V(-1, -1, -1), V(1, -1, -1), V(1, 1, -1), V(-1, 1, -1),
    V(-1, -1, 1), V(1, -1, 1), V(1, 1, 1), V(-1, 1, 1)
  ];

  var cubeEdges = [
    [0,1],[1,2],[2,3],[3,0],
    [4,5],[5,6],[6,7],[7,4],
    [0,4],[1,5],[2,6],[3,7],
    // croix sur la face avant/arrière, comme un fond de caisse
    [0,2],[1,3],[4,6],[5,7]
  ];

  var angleY = 0.4;
  var angleX = 0.25;

  function drawCube(time) {
    angleY += 0.006;
    angleX = 0.25 + Math.sin(time * 0.0004) * 0.12;

    var scale = Math.min(W, H) * 0.16;
    var dist = 4.2;
    var fov = 260;

    var projected = [];
    var i;
    for (i = 0; i < cubeVerts.length; i++) {
      var p = cubeVerts[i];
      p = rotateY(p, angleY);
      p = rotateX(p, angleX);
      var z = p.z * scale + dist * scale;
      var f = fov / (z + fov);
      projected.push({
        x: CX + p.x * scale * f,
        y: CY - 40 + p.y * scale * f,
        z: z
      });
    }

    ctx.lineWidth = 1.4;
    ctx.strokeStyle = "rgba(92, 255, 160, 0.85)";
    ctx.shadowColor = "rgba(60, 255, 139, 0.9)";
    ctx.shadowBlur = 8;

    for (i = 0; i < cubeEdges.length; i++) {
      var a = projected[cubeEdges[i][0]];
      var b = projected[cubeEdges[i][1]];
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  // Poussière ambiante (léger effet de profondeur, sans surcharge visuelle)
  var DUST_COUNT = 60;
  var dust = [];
  for (var d = 0; d < DUST_COUNT; d++) {
    dust.push({
      x: Math.random() * 2000 - 1000,
      y: Math.random() * 2000 - 1000,
      z: Math.random() * 1000 + 1
    });
  }

  function drawDust() {
    var fov = 260;
    ctx.fillStyle = "rgba(120, 200, 160, 0.55)";
    for (var i = 0; i < dust.length; i++) {
      var p = dust[i];
      p.z -= 1.4;
      if (p.z <= 1) { p.z = 1000; p.x = Math.random() * 2000 - 1000; p.y = Math.random() * 2000 - 1000; }
      var f = fov / p.z;
      var sx = CX + p.x * f;
      var sy = CY + p.y * f;
      if (sx < 0 || sx > W || sy < 0 || sy > H) continue;
      var r = Math.max(0.3, 1.6 * f);
      ctx.beginPath();
      ctx.arc(sx, sy, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function frame(time) {
    // effacement avec traînée légère -> persistance façon écran phosphore
    ctx.fillStyle = "rgba(4, 8, 5, 0.35)";
    ctx.fillRect(0, 0, W, H);

    drawDust();
    drawCube(time);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------------------------------------------------------------
  // Faux journal de démarrage, tapé au fil de l'eau (habillage terminal)
  // ---------------------------------------------------------------
  var lines = [
    "> init_moteur() ................ [<span class=\"ok\">OK</span>]",
    "> chargement des maps ........... [<span class=\"ok\">OK</span>]",
    "> attribution d'un domicile ..... [<span class=\"amber\">ECHEC</span>]",
    "> repli sur <span class=\"path\">nikhil.fr</span> ......... [<span class=\"ok\">OK</span>]",
    "> statut : multimode, gratuit, errant."
  ];

  var logEl = document.getElementById("log");
  var lineIndex = 0;
  var charIndex = 0;
  var built = "";

  function typeNext() {
    if (lineIndex >= lines.length) {
      logEl.innerHTML = built + '<span id="cursor"></span>';
      return;
    }
    var current = lines[lineIndex];
    // on tape le texte visible sans casser les balises HTML
    var plain = current.replace(/<[^>]+>/g, "");
    if (charIndex <= plain.length) {
      // affichage progressif simple : on montre la ligne complète avec un délai par ligne
      logEl.innerHTML = built + current.slice(0, 0) + plain.slice(0, charIndex);
      charIndex++;
      setTimeout(typeNext, 14);
    } else {
      built += current + "\n";
      lineIndex++;
      charIndex = 0;
      setTimeout(typeNext, 220);
    }
  }
  setTimeout(typeNext, 400);

  // Horloge simple dans la barre du haut
  function tickClock() {
    var now = new Date();
    function pad(n) { return (n < 10 ? "0" : "") + n; }
    document.getElementById("clockline").textContent =
      pad(now.getHours()) + ":" + pad(now.getMinutes()) + ":" + pad(now.getSeconds());
    setTimeout(tickClock, 1000);
  }
  tickClock();

})();
</script>

</body>
</html>
